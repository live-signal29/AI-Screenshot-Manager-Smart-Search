name: Android Debug CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore status:"
          ls -la debug.keystore

      - name: Ensure .env file
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK & App Bundle (AAB)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug bundleRelease bundleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug bundleRelease bundleDebug --no-daemon --stacktrace
          fi
          echo "=== Generated APK Files ==="
          find app/build/ -name "*.apk" || true
          echo "=== Generated AAB Files ==="
          find app/build/ -name "*.aab" || true

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            .build-outputs/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload App Bundle (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-aab
          path: |
            app/build/outputs/bundle/**/*.aab
            app/build/intermediates/intermediary_bundle/**/*.aab
            .build-outputs/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon || true
          else
            gradle testDebugUnitTest --no-daemon || true
          fi
